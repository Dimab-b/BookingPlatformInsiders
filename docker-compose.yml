services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
      Jwt__Issuer: ${JWT__ISSUER}
      Jwt__Audience: ${JWT__AUDIENCE}
      Jwt__SigningKey: ${JWT__SIGNINGKEY}
      Auth__RefreshCookieName: ${AUTH__REFRESHCOOKIENAME}
      Auth__RefreshCookiePath: ${AUTH__REFRESHCOOKIEPATH}
      Auth__RequireSecureCookies: ${AUTH__REQUIRESECURECOOKIES}
      Auth__RefreshCookieSameSite: ${AUTH__REFRESHCOOKIESAMESITE}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
